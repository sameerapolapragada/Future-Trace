# Future Trace — Supabase CLI config
# Docs: https://supabase.com/docs/guides/cli/config
#
# GitHub integration: link this repo's "Dev" branch to your Supabase *dev* branch.
# Migrations in supabase/migrations/ apply to that branch's database only.
# Production (main) should use a separate Supabase branch / manual promotion.

project_id = "fepqvdleqodzygquihbj"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["exp://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
